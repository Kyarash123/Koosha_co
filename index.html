<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00a0b0">
  <meta name="description" content="Koosha co - Instagram Content Planner">

  <title>Koosha co | برنامه‌ریز محتوای اینستاگرام</title>

  <link rel="icon" href="./koosha-co-logo.png" type="image/png">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
  >

  <!-- فقط برای قابلیت دانلود تصویر -->
  <script
    src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
    defer
  ></script>

  <style>
    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {
      --primary: #00a0b0;
      --primary-dark: #006b75;
      --secondary: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --background: #9ad8ed;
      --dark: #050120;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 30px;

      --shadow-sm: 0 5px 18px rgba(5, 1, 32, .07);
      --shadow-md: 0 12px 35px rgba(5, 1, 32, .10);
      --shadow-lg: 0 20px 55px rgba(5, 1, 32, .15);

      --container: 1180px;
    }

    /* =====================================================
       RESET
    ===================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    ::selection {
      background: var(--primary);
      color: #fff;
    }

    /* =====================================================
       LAYOUT
    ===================================================== */

    .app {
      min-height: 100vh;
    }

    .container {
      width: min(
        calc(100% - 32px),
        var(--container)
      );
      margin-inline: auto;
    }

    .hidden {
      display: none !important;
    }

    .text-center {
      text-align: center;
    }

    /* =====================================================
       BACKGROUNDS
    ===================================================== */

    .main-bg {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,.45),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(0,160,176,.22),
          transparent 35%
        ),
        var(--background);
    }

    .gradient {
      background:
        linear-gradient(
          135deg,
          var(--primary-dark) 0%,
          var(--primary) 100%
        );
    }

    .gradient-soft {
      background:
        linear-gradient(
          135deg,
          rgba(0,160,176,.10),
          rgba(0,107,117,.04)
        );
    }

    /* =====================================================
       CARDS
    ===================================================== */

    .card {
      background: var(--secondary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    .login-wrapper {
      width: min(100%, 450px);
    }

    .login-card {
      padding: 36px;
      animation: fadeUp .45s ease both;
    }

    .logo-box {
      width: 100px;
      height: 100px;
      margin: 0 auto 22px;
      padding: 8px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      background: #fff;
    }

    .logo-fallback {
      color: #fff;
      font-size: 28px;
      font-weight: 900;
    }

    .login-title {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
      font-weight: 900;
      line-height: 1.5;
    }

    .login-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .form-group {
      margin-top: 28px;
    }

    .form-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 800;
    }

    .input {
      width: 100%;
      min-height: 54px;
      padding: 12px 15px;
      border: 2px solid #dbe3ea;
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: .2s ease;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 4px rgba(0,160,176,.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .input {
      padding-left: 55px;
    }

    .password-toggle {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #475569;
    }

    .error-box {
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
    }

    .login-footer {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      color: #94a3b8;
      font-size: 11px;
    }

    /* =====================================================
       BUTTONS
    ===================================================== */

    .btn {
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        opacity .18s ease,
        background .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
      box-shadow:
        0 10px 25px rgba(0,160,176,.22);
    }

    .btn-dark {
      color: #fff;
      background: var(--dark);
    }

    .btn-light {
      color: var(--text);
      background: #fff;
    }

    .btn-outline {
      color: var(--primary-dark);
      background: #fff;
      border: 2px solid var(--primary-dark);
    }

    .btn-danger {
      color: #fff;
      background: var(--danger);
    }

    .btn-block {
      width: 100%;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .app-header {
      padding: 24px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      padding: 4px;
      border-radius: 16px;
      flex: 0 0 auto;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      background: #fff;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 900;
    }

    .brand-caption {
      color: rgba(17,24,39,.60);
      font-size: 11px;
    }

    /* =====================================================
       PROGRESS
    ===================================================== */

    .progress-wrapper {
      margin-top: 22px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: rgba(17,24,39,.65);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.65);
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--primary-dark),
          var(--primary)
        );
      transition: width .35s ease;
    }

    /* =====================================================
       QUESTION
    ===================================================== */

    .question-card {
      padding: clamp(22px, 5vw, 42px);
      margin-bottom: 30px;
      animation: fadeUp .4s ease both;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 99px;
      background: #ecfeff;
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 900;
    }

    .question-title {
      margin: 15px 0 8px;
      font-size: clamp(23px, 4vw, 34px);
      line-height: 1.6;
      font-weight: 900;
    }

    .question-description {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .option {
      width: 100%;
      min-height: 82px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 17px;
      background: #fff;
      color: var(--text);
      text-align: right;
      transition:
        border-color .18s ease,
        background .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }

    .option:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .option.selected {
      border-color: var(--primary);
      background: #f0fdff;
      box-shadow:
        0 10px 25px rgba(0,160,176,.13);
    }

    .option-number {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--dark);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .option.selected .option-number {
      background: var(--primary);
    }

    .option-text {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.8;
    }

    .question-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }

    .hint {
      color: #94a3b8;
      font-size: 11px;
    }

    /* =====================================================
       RESULTS HERO
    ===================================================== */

    .results-hero {
      margin-bottom: 24px;
      padding: clamp(24px, 5vw, 38px);
      border-radius: var(--radius-xl);
      color: #fff;
      box-shadow: var(--shadow-lg);
    }

    .results-hero-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .results-eyebrow {
      margin-bottom: 7px;
      font-size: 12px;
      opacity: .75;
      font-weight: 700;
    }

    .results-title {
      margin: 0;
      font-size: clamp(25px, 5vw, 40px);
      line-height: 1.5;
      font-weight: 900;
    }

    .results-subtitle {
      margin: 8px 0 0;
      opacity: .88;
      font-size: 14px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      flex: 0 0 auto;
    }

    /* =====================================================
       SUMMARY
    ===================================================== */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }

    .summary-card {
      padding: 16px;
      min-height: 125px;
    }

    .summary-icon {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .summary-label {
      margin-bottom: 3px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }

    .summary-value {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.8;
    }

    /* =====================================================
       RESULTS GRID
    ===================================================== */

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .content-card {
      display: flex;
      flex-direction: column;
      padding: 20px;
      animation: fadeUp .4s ease both;
    }

    .content-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 17px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.6;
    }

    .tag-primary {
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
    }

    .tag-gray {
      color: #475569;
      background: #f1f5f9;
    }

    .section-box {
      margin-bottom: 12px;
      padding: 13px;
      border-radius: 14px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .section-title {
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
    }

    .section-content {
      margin: 0;
      font-size: 12px;
      line-height: 2;
    }

    .time-box {
      background: #ecfeff;
    }

    .hook-box {
      background: #f8fafc;
    }

    .scenario-box {
      background: #f8fafc;
    }

    .cta-box {
      color: #fff;
      background: var(--dark);
    }

    .cta-box .section-title {
      color: rgba(255,255,255,.55);
    }

    .format-box {
      background: #f8fafc;
    }

    .copy-btn {
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid #dbe3ea;
      border-radius: 8px;
      background: #fff;
      color: #334155;
      font-size: 9px;
      font-weight: 800;
      transition: .18s ease;
    }

    .copy-btn:hover {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .score-wrapper {
      margin-top: auto;
      padding-top: 5px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
    }

    .score-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #e2e8f0;
    }

    .score-bar {
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--primary-dark),
          var(--primary)
        );
    }

    .hashtags {
      margin-top: 13px;
      color: #64748b;
      font-size: 9px;
      line-height: 2;
    }

    /* =====================================================
       FINAL SECTION
    ===================================================== */

    .final-card {
      margin: 25px 0 40px;
      padding: clamp(22px, 5vw, 36px);
    }

    .final-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    .final-description {
      max-width: 800px;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 2.2;
    }

    .tips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .tip {
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      text-align: center;
    }

    .tip-icon {
      font-size: 24px;
    }

    .tip-title {
      margin-top: 6px;
      font-weight: 900;
      font-size: 13px;
    }

    .tip-text {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 10px;
      line-height: 1.9;
    }

    .final-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .footer {
      padding: 0 0 30px;
      text-align: center;
      color: rgba(17,24,39,.55);
      font-size: 10px;
    }

    /* =====================================================
       LOADER
    ===================================================== */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(10px);
    }

    .spinner {
      width: 54px;
      height: 54px;
      border: 5px solid #dff4f6;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loader-text {
      margin-top: 17px;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100000;
      max-width: calc(100% - 30px);
      padding: 12px 18px;
      border-radius: 13px;
      background: #111827;
      color: #fff;
      box-shadow: var(--shadow-lg);
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 800;
      animation: toastIn .25s ease both;
    }

    /* =====================================================
       PRINT
    ===================================================== */

    @media print {

      body {
        background: #fff !important;
      }

      .no-print,
      .hero-actions,
      .final-actions,
      .footer {
        display: none !important;
      }

      .container {
        width: 100%;
        max-width: none;
      }

      .card,
      .content-card {
        box-shadow: none !important;
      }

      .results-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .results-hero {
        color: #000;
        background: #fff !important;
        border: 2px solid #ddd;
      }

      .content-card {
        break-inside: avoid;
      }
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 950px) {

      .results-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .results-hero-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 700px) {

      .container {
        width: min(
          calc(100% - 20px),
          var(--container)
        );
      }

      .login-card {
        padding: 25px 20px;
      }

      .options-grid,
      .results-grid,
      .tips-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .question-card {
        padding: 22px 16px;
      }

      .question-title {
        font-size: 23px;
      }

      .question-footer {
        align-items: stretch;
        flex-direction: column-reverse;
      }

      .hint {
        text-align: center;
      }

      .hero-actions {
        width: 100%;
      }

      .hero-actions .btn {
        flex: 1;
      }

      .content-card {
        padding: 16px;
      }
    }

    @media (max-width: 430px) {

      .topbar {
        align-items: flex-start;
      }

      .brand-logo {
        width: 45px;
        height: 45px;
      }

      .brand-name {
        font-size: 15px;
      }

      .brand-caption {
        font-size: 9px;
      }

      .option {
        min-height: 72px;
        padding: 12px;
      }

      .option-number {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }

      .option-text {
        font-size: 12px;
      }

      .btn {
        padding-inline: 13px;
        font-size: 11px;
      }
    }

    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 15px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   KOOSHA CONTENT PLANNER
   Version 3.0
========================================================= */

(function () {

  /* =======================================================
     CONFIG
  ======================================================= */

  const CONFIG = {
    appTitle: "کوشا کمپانی",
    logoText: "Koosha co",

    /*
      توجه:
      این رمز فقط برای استفاده داخلی/دمو است.
      در یک فایل HTML خالص، رمز عبور امنیت واقعی ایجاد نمی‌کند.
      برای محیط واقعی باید Authentication سمت سرور اضافه شود.
    */
    password: "koosha",

    primary: "#00a0b0",
    primaryDark: "#006b75",
    secondary: "#ffffff",
    text: "#111827",
    background: "#9ad8ed",

    storageKey: "koosha_content_planner_v3"
  };

  /* =======================================================
     QUESTIONS
  ======================================================= */

  const QUESTIONS = [

    {
      id: "industry",

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttribute(value) {
    return encodeURIComponent(String(value ?? ""));
  }

  function decodeAttribute(value) {
    try {
      return decodeURIComponent(value);
    } catch {
      return value;
    }
  }

  function $(selector) {
    return document.querySelector(selector);
  }

  function getQuestion() {
    return QUESTIONS[state.step];

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function showToast(message) {

    document.querySelector(".toast")?.remove();

    const toast = document.createElement("div");

    toast.className = "toast";
    toast.textContent = message;

    document.body.appendChild(toast);

    setTimeout(() => {
      toast.remove();
    }, 2800);
  }

  function showLoader(message) {

    hideLoader();

    const loader =
      document.createElement("div");

    loader.className = "loader";
    loader.id = "globalLoader";

    loader.innerHTML = `
      <div class="spinner"></div>
      <div class="loader-text">
        ${escapeHTML(message)}
      </div>
    `;

    document.body.appendChild(loader);
  }

  function hideLoader() {
    document.getElementById("globalLoader")?.remove();
  }

      document.documentElement;

    root.style.setProperty(
      "--primary",
      CONFIG.primary
    );

    root.style.setProperty(
      "--primary-dark",
      CONFIG.primaryDark
    );

    root.style.setProperty(
      "--secondary",
      CONFIG.secondary
    );

    root.style.setProperty(
      "--text",
      CONFIG.text
    );

    root.style.setProperty(
      "--background",
      CONFIG.background
    );
  }

  /* =======================================================
     STORAGE
  ======================================================= */

  function saveState() {

    try {

      localStorage.setItem(
        CONFIG.storageKey,
        JSON.stringify({
          answers: state.answers,
          content: state.content,
          generation: state.generation
        })
      );

    } catch (error) {

      console.warn(
        "LocalStorage unavailable:",
        error
      );

    }
  }

  function loadState() {

    try {

      const raw =
        localStorage.getItem(CONFIG.storageKey);

      if (!raw) return;

      const saved =
        JSON.parse(raw);

      if (
        saved &&
        typeof saved.answers === "object"
      ) {
        state.answers = saved.answers;
      }

      if (
        saved &&
        Array.isArray(saved.content)
      ) {
        state.content = saved.content;
      }

      if (
        saved &&
        Number.isFinite(saved.generation)
      ) {
        state.generation =
          saved.generation;
      }

    } catch (error) {

      console.warn(
        "Could not load saved state:",
        error
      );

    }
  }

  function clearSavedData() {

    try {
      localStorage.removeItem(
        CONFIG.storageKey
      );
    } catch (_) {}

  }

  function togglePassword() {

    const input =
      $("#passwordInput");

    const button =
      $("#togglePassword");

    if (!input) return;

    if (input.type === "password") {

      input.type = "text";
      button.textContent = "○";

    } else {

      input.type = "password";
      button.textContent = "●";

    }
  }

  function handleLogin(event) {

    event.preventDefault();

    const input =
      $("#passwordInput");

    const error =
      $("#loginError");

    if (!input) return;

    const password =
      input.value.trim();

    if (password === CONFIG.password) {

      state.loggedIn = true;

      error?.classList.add("hidden");

      if (
        state.content.length === 7 &&
        Object.keys(state.answers).length ===
        QUESTIONS.length
      ) {

        renderResults();

      } else {

        state.step =
          findFirstIncompleteStep();

        renderQuestionnaire();

      }

    } else {

      error?.classList.remove("hidden");

      input.value = "";
      input.focus();

    }
  }

  function findFirstIncompleteStep() {

    for (
      let i = 0;
      i < QUESTIONS.length;
      i++
    ) {

      if (!state.answers[QUESTIONS[i].id]) {
        return i;
      }

    }

    return 0;
  }

  function bindQuestionEvents() {

    document
      .querySelectorAll("[data-option-index]")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const question =
              getQuestion();

            const index =
              Number(
                button.dataset.optionIndex
              );

            state.answers[question.id] =
              question.options[index];

            saveState();

            if (
              state.step <
              QUESTIONS.length - 1
            ) {

              state.step++;
              renderQuestionnaire();

            } else {

              generateAndShowResults();

            }

          }
        );

      });

    $("#backBtn")
      ?.addEventListener(
        "click",
        () => {

          state.step =
            Math.max(0, state.step - 1);

          renderQuestionnaire();

        }
      );

    $("#logoutBtn")
      ?.addEventListener(
        "click",
        logout
      );
  }

  function generateAndShowResults() {

    showLoader(
      "در حال ساخت تقویم محتوایی..."
    );

    setTimeout(() => {

      state.generation++;

      state.content =
        generateContent();

      saveState();

      hideLoader();

      renderResults();

    }, 350);
  }

  function generateContent() {

    const industry =
      state.answers.industry;

    const strategy =
      INDUSTRIES[industry];

    if (!strategy) {
      return [];
    }

    const generated = [];

    for (let i = 0; i < 7; i++) {

      const type =
        strategy.formats[i];

      const hookTemplate =
        strategy.hooks[i];

      const bestTime =
        strategy.times[i];

      const format =
        chooseContentFormat(
          i,
          type
        );

      const hook =
        createHook(
          hookTemplate,
          i
        );

      const scenario =
        createScenario(
          type,
          i
        );

      const cta =
        createCTA(i);

      const hashtags =
        createHashtags(
          strategy.hashtags
        );

      const score =
        calculateScore(
          type,
          format
        );

      generated.push({
        day: getDay(i),
        type,
        bestTime,
        hook,
        scenario,
        cta,
        format,
        hashtags,
        score
      });

    }

    return generated;
  }

  function getDay(index) {

    const days = [
      "شنبه",
      "یکشنبه",
      "دوشنبه",
      "سه‌شنبه",
      "چهارشنبه",
      "پنجشنبه",
      "جمعه"
    ];

    return days[index];
  }

  function createHook(template, index) {

    const business =
      state.answers.business_type ||
      "کسب‌وکار شما";

    const variations = [
      template,
      template.replace(
        "چند",
        `${3 + ((index + state.generation) % 4)}`
      ),
      template
        .replace(
          "این موضوع",
          business
        )
    ];

    return variations[
      (index + state.generation) %
      variations.length
    ];
  }

  function chooseContentFormat(
    index,
    recommended
  ) {

    const preferred =
      state.answers.content_format;

    if (!preferred) {
      return recommended;
    }

    if (index % 3 !== 1) {
      return preferred;
    }

    return recommended;
  }

  function createCTA(index) {

    const goal =
      state.answers.content_goal || "";

    const engagement =
      state.answers.engagement_preference || "";

    if (goal.includes("فروش")) {

      const ctas = [
        "برای دریافت قیمت و اطلاعات بیشتر پیام بده.",
        "اگر این محصول یا خدمت را می‌خواهی، پیام بده.",
        "برای ثبت سفارش از مسیر ارتباطی صفحه استفاده کن."
      ];

      return ctas[
        (index + state.generation) %
        ctas.length
      ];
    }

    if (engagement.includes("ذخیره")) {
      return "این محتوا را ذخیره کن تا بعداً دوباره به آن مراجعه کنی.";
    }

    if (engagement.includes("پیام")) {
      return "اگر سؤال یا ابهامی داری، همین حالا پیام بده.";
    }

    if (engagement.includes("تگ")) {
      return "این پست را برای یک دوست بفرست و او را تگ کن.";
    }

    if (engagement.includes("کامنت")) {
      return "نظرت را در کامنت بنویس.";
    }

    return "اگر این محتوا برایت مفید بود، آن را ذخیره و با دوستانت به اشتراک بگذار.";
  }

  function createHashtags(base) {

    const tags = [
      ...base,
      makeTag(state.answers.industry),
      makeTag(state.answers.business_type),
      makeTag(state.answers.content_goal)
    ];

    return [
      ...new Set(
        tags.filter(Boolean)
      )
    ]
      .slice(0, 9)
      .join(" ");
  }

  function makeTag(value) {

    if (!value) return "";

    return "#" +
      String(value)
        .replace(/\//g, "")
        .replace(/\s+/g, "_")
        .replace(/[^\u0600-\u06FFa-zA-Z0-9_]/g, "");
  }

  function calculateScore(
    type,
    format
  ) {

    let score = 72;

    const goal =
      state.answers.content_goal || "";

    const engagement =
      state.answers.engagement_preference || "";

    if (
      goal.includes("فروش") &&
      (
        type.includes("فروش") ||
        type.includes("معرفی") ||
        type.includes("پیشنهاد")
      )
    ) {
      score += 10;
    }

    if (
      engagement.includes("کامنت") &&
      type.includes("چالش")
    ) {
      score += 8;
    }

    if (
      format.includes("ویدیویی") ||
      format.includes("Reel")
    ) {
      score += 5;
    }

    if (type.includes("آموزش")) {
      score += 4;
    }

    return Math.min(
      98,
      score
    );
  }

  /* =======================================================
     RESULT EVENTS
  ======================================================= */

  function bindResultEvents() {

    document
      .querySelectorAll("[data-copy]")
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            const value =
              decodeAttribute(
                button.dataset.copy
              );

            await copyText(value);

          }
        );

      });

    $("#downloadBtn")
      ?.addEventListener(
        "click",
        downloadImage
      );

    $("#copyAllBtn")
      ?.addEventListener(
        "click",
        copyAllContent
      );

    $("#editBtn")
      ?.addEventListener(
        "click",
        editAnswers
      );

    $("#regenerateBtn")
      ?.addEventListener(
        "click",
        regenerate
      );

    $("#printBtn")
      ?.addEventListener(
        "click",
        () => window.print()
      );

    $("#resetBtn")
      ?.addEventListener(
        "click",
        resetEverything
      );

    $("#logoutBtn")
      ?.addEventListener(
        "click",
        logout
      );
  }

  /* =======================================================
     COPY
  ======================================================= */

  async function copyText(text) {

    try {

      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {

        await navigator.clipboard.writeText(
          text
        );

      } else {

        const textarea =
          document.createElement("textarea");

        textarea.value = text;

        textarea.style.position =
          "fixed";

        textarea.style.left =
          "-9999px";

        document.body.appendChild(
          textarea
        );

        textarea.select();

        document.execCommand("copy");

        textarea.remove();
      }

      showToast(
        "متن با موفقیت کپی شد ✓"
      );

    } catch (error) {

      console.error(error);

      showToast(
        "کپی کردن انجام نشد."
      );

    }
  }

    const text =

${item.type}

زمان:
${item.bestTime}

${item.hook}

${item.scenario}

CTA:
${item.cta}

فرمت:
${item.format}

هشتگ‌ها:
${item.hashtags}

`;

        })
        .join("\n");

    await copyText(text);
  }

  /* =======================================================

  ======================================================= */

  async function downloadImage() {

    if (
      typeof window.html2canvas !==
      "function"
    ) {

      showToast(
        "امکان دانلود تصویر در حال حاضر در دسترس نیست. از چاپ / PDF استفاده کنید."
      );

      return;
    }

    showLoader(
      "در حال ساخت تصویر..."
    );

    let wrapper = null;

    try {

      wrapper =
        document.createElement("div");

      wrapper.style.position =
        "fixed";

      wrapper.style.left =
        "-20000px";

      wrapper.style.top =
        "0";

      wrapper.style.width =
        "1200px";

      wrapper.style.background =
        "#ffffff";

      wrapper.style.zIndex =
        "-1";

      wrapper.innerHTML =
        createExportHTML();

      document.body.appendChild(
        wrapper
      );

      if (
        document.fonts &&
        document.fonts.ready
      ) {

        try {
          await document.fonts.ready;
        } catch (_) {}

      }

      await wait(250);

      const canvas =
        await window.html2canvas(
          wrapper,
          {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true,
            allowTaint: false,
            logging: false
          }
        );

      const link =
        document.createElement("a");

      const date =
        new Date()
          .toLocaleDateString("fa-IR")
          .replace(/\//g, "-");

      link.download =
        `Koosha-Content-${date}.png`;

      link.href =
        canvas.toDataURL(
          "image/png",
          1
        );

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      showToast(
        "تصویر با موفقیت ساخته شد ✓"
      );

    } catch (error) {

      console.error(
        "Download error:",
        error
      );

      showToast(
        "ساخت تصویر انجام نشد. از گزینه چاپ / PDF استفاده کنید."
      );

    } finally {

      wrapper?.remove();

      hideLoader();

    }
  }

  /* =======================================================
     NAVIGATION
  ======================================================= */

  function editAnswers() {

    state.step =
      findFirstIncompleteStep();

    renderQuestionnaire();
  }

  function regenerate() {

    showLoader(
      "در حال تولید نسخه جدید..."
    );

    setTimeout(() => {

      state.generation++;

      state.content =
        generateContent();

      saveState();

      hideLoader();

      renderResults();

      showToast(
        "نسخه جدید تولید شد ✓"
      );

    }, 300);
  }

  function resetEverything() {

    const confirmed =
      window.confirm(
        "آیا مطمئن هستید که تمام پاسخ‌ها و تقویم فعلی پاک شود؟"
      );

    if (!confirmed) return;

    state = {
      loggedIn: true,
      step: 0,
      answers: {},
      content: [],
      generation: 0
    };

    clearSavedData();

    renderQuestionnaire();

    showToast(
      "اطلاعات پاک شد."
    );
  }

  function logout() {

    state.loggedIn = false;

    renderLogin();
  }

  /* =======================================================
     START
  ======================================================= */

  function init() {

    applyTheme();

    loadState();

    renderLogin();

  }

  init();

})();
