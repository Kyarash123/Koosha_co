  <style>
    :root {
      --primary: #00a0b0;
      --primary-dark: #006b75;
      --secondary: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --background: #9ad8ed;
      --dark: #050120;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .gradient {
      background:
        linear-gradient(
          135deg,
          #486878 0%,
          #7591a2 35%,
          #3e6fb4 70%,
          #00a0b0 100%
        );
    }

    .gradient-text {
      background:
        linear-gradient(
          135deg,
          #486878,
          #3e6fb4,
          #00a0b0
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page {
      min-height: 100vh;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    .fade-in {
      animation: fadeIn .45s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--secondary);
      border-radius: var(--radius);
      box-shadow: 0 15px 45px rgba(5, 1, 32, .12);
    }

    .option-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 92px;
      padding: 18px;
      border: 2px solid #dbe3ea;
      background: #fff;
      border-radius: 18px;
      color: var(--text);
      text-align: right;
      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .option-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 12px 28px rgba(0, 160, 176, .16);
    }

    .option-card.selected {
      border-color: var(--primary);
      background: #f0fcfd;
      box-shadow: 0 10px 25px rgba(0, 160, 176, .14);
    }

    .option-number {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--dark);
      color: #fff;
      font-weight: 800;
    }

    .option-card.selected .option-number {
      background: var(--primary);
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      background: rgba(255,255,255,.55);
      border-radius: 99px;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      transition: width .4s ease;
    }

    .content-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(5,1,32,.08);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .content-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 22px 50px rgba(5,1,32,.15);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .section-box {
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 14px;
    }

    .section-title {
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .copy-btn {
      border: 1px solid #dbe3ea;
      background: #fff;
      color: var(--dark);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      transition: .2s ease;
    }

    .copy-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 9999;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 13px 20px;
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,.25);
      animation: toastIn .25s ease;
      font-size: 14px;
      font-weight: 600;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 15px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid #dceff1;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .login-input {
      width: 100%;
      padding: 15px 17px;
      border: 2px solid #dbe3ea;
      border-radius: 14px;
      outline: none;
      transition: .2s ease;
      background: #fff;
    }

    .login-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0,160,176,.1);
    }

    .empty-state {
      padding: 35px;
      text-align: center;
      background: rgba(255,255,255,.7);
      border-radius: 20px;
    }

    .summary-item {
      padding: 13px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .download-area {
      position: absolute;
      left: -99999px;
      top: 0;
      width: 1200px;
      background: #fff;
      direction: rtl;
    }

    .download-inner {
      width: 1200px;
      padding: 45px;
      background: #fff;
    }

    .download-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .download-card {
      padding: 20px;
      border: 1px solid #dbe3ea;
      border-radius: 18px;
      background: #fff;
      page-break-inside: avoid;
    }

    .download-header {
      margin-bottom: 25px;
      padding: 28px;
      border-radius: 20px;
      text-align: center;
      color: #fff;
    }

    @media (max-width: 768px) {
      .container {
        width: min(100% - 20px, 1180px);
      }

      .download-grid {
        grid-template-columns: 1fr;
      }

      .download-area,
      .download-inner {
        width: 900px;
      }
    }

    @media print {
      .no-print {
        display: none !important;
      }
    }
  </style>

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function showToast(message) {
  const old = document.querySelector(".toast");
  if (old) old.remove();

  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;

  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = "0";
    setTimeout(() => toast.remove(), 250);
  }, 2500);
}

function showLoader(message = "در حال آماده‌سازی...") {
  hideLoader();

  const overlay = document.createElement("div");
  overlay.id = "loader";
  overlay.className = "loader-overlay";

  overlay.innerHTML = `
    <div class="spinner"></div>
    <p style="margin-top:20px;font-weight:700;color:#111827;">
      ${escapeHTML(message)}
    </p>
  `;

  document.body.appendChild(overlay);
}

function hideLoader() {
  document.getElementById("loader")?.remove();
}

function saveState() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        answers: state.answers,
        generated: state.generated
      })
    );
  } catch (error) {
    console.warn("Storage unavailable:", error);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) return;

    const data = JSON.parse(raw);

    if (data?.answers) {
      state.answers = data.answers;
    }

    if (Array.isArray(data?.generated)) {
      state.generated = data.generated;
    }
  } catch (error) {
    console.warn("Could not load saved state:", error);
  }
}

function generateContent() {

  const industry = state.answers.industry;
  const strategy = INDUSTRIES[industry];

  if (!strategy) {
    return [];
  }

  const days = [
    "شنبه",
    "یکشنبه",
    "دوشنبه",
    "سه‌شنبه",
    "چهارشنبه",
    "پنجشنبه",
    "جمعه"
  ];

  const topic = state.answers.business_type || "کسب‌وکار شما";
  const audience = state.answers.audience || "مخاطبان شما";
  const goal = state.answers.content_goal || "رشد برند";
  const voice = state.answers.brand_voice || "دوستانه و صمیمی";
  const pain = state.answers.pain_point || "نیاز اصلی مخاطب";
  const value = state.answers.unique_value || "مزیت رقابتی شما";
  const format = state.answers.content_format || "ویدیوی کوتاه / Reel";
  const engagement = state.answers.engagement_preference || "کامنت و بحث";

  return strategy.types.map((type, index) => {

    const template = type[0];
    const category = type[1];
    const day = type[2];
    const bestTime = type[3];

    let hook = strategy.hooks[index % strategy.hooks.length];

    hook = hook
      .replaceAll("{number}", String(randomInt(3, 7)))
      .replaceAll("{topic}", topic)
      .replaceAll("{audience}", audience);

    const contentPlan = createContentPlan({
      template,
      category,
      industry,
      audience,
      goal,
      voice,
      pain,
      value,
      format
    });

    const cta = createCTA(goal, engagement, category);

    const hashtags = [
      ...strategy.hashtags,
      normalizeTag(industry),
      normalizeTag(state.answers.business_type),
      normalizeTag(state.answers.content_goal)
    ]
      .filter(Boolean)
      .filter((item, index, arr) => arr.indexOf(item) === index)
      .slice(0, 9)
      .map(item => `#${item}`)
      .join(" ");

    const score = calculateScore({
      goal,
      category,
      format,
      engagement
    });

    return {
      day,
      template,
      category,
      bestTime,
      hook,
      content: contentPlan,
      cta,
      hashtags,
      format,
      engagement,
      score
    };
  });
}

function normalizeTag(value) {
  if (!value) return "";

  return String(value)
    .replace(/\//g, "")
    .replace(/\s+/g, "_")
    .replace(/[^\u0600-\u06FFa-zA-Z0-9_]/g, "");
}

function createCTA(goal, engagement, category) {

  if (goal.includes("فروش")) {
    return randomItem([
      "برای دریافت قیمت و اطلاعات بیشتر پیام بده",
      "اگر این محصول را می‌خواهی، همین حالا DM کن",
      "برای ثبت سفارش از لینک پروفایل استفاده کن"
    ]);
  }

  if (engagement.includes("ذخیره")) {
    return "این پست را ذخیره کن تا بعداً به آن برگردی.";
  }

  if (engagement.includes("پیام")) {
    return "اگر سؤال داری، همین حالا پیام بده.";
  }

  if (category === "تعامل") {
    return "نظرت را در کامنت بنویس و این پست را برای دوستت بفرست.";
  }

  return randomItem([
    "نظرت را در کامنت بنویس.",
    "اگر مفید بود ذخیره‌اش کن.",
    "برای کسی که به این موضوع نیاز دارد ارسالش کن.",
    "اگر قسمت بعدی را می‌خواهی، کامنت بگذار."
  ]);
}

function calculateScore({ goal, category, format, engagement }) {

  let score = 70;

  if (goal.includes("فروش") && category === "فروش") score += 10;
  if (category === "تعامل" && engagement.includes("کامنت")) score += 8;
  if (format.includes("ویدیو") && category === "ویدیویی") score += 7;
  if (category === "آموزشی") score += 3;

  return Math.min(score, 98);
}

  const password =

    state.loggedIn = true;

    if (
      state.generated.length === 7 &&
      Object.keys(state.answers).length === QUESTIONS.length

      renderResults();

      renderQuestionnaire();

  } else {

    const error =
      document.getElementById("loginError");

    error.classList.remove("hidden");

  }

              سؤال ${state.currentStep + 1}
              از ${QUESTIONS.length}
            </div>

          </div>

            <div
              class="progress-bar gradient"
              style="width:${progress}%"
            ></div>

        </header>

          <div class="mb-8">

            <div class="inline-flex tag bg-cyan-50 text-cyan-800 mb-4">
              مرحله ${state.currentStep + 1}
            </div>

            <h1 class="text-2xl sm:text-3xl font-black leading-relaxed">
              ${escapeHTML(question.title)}
            </h1>

            ${
              question.description
                ? `
                  <p class="mt-3 text-slate-500 leading-8">
                    ${escapeHTML(question.description)}
                  </p>
                `
                : ""
            }

          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            ${question.options.map((option, index) => {

              const selected =
                state.answers[question.id] === option;

              return `
                <button
                  type="button"
                  class="option-card ${selected ? "selected" : ""}"
                  data-option-index="${index}"
                >

                  <div class="flex items-center gap-4">

                    <span class="option-number">
                      ${index + 1}
                    </span>

                    <span class="font-bold leading-7">
                      ${escapeHTML(option)}
                    </span>

                  </div>

                </button>
              `;

            }).join("")}

          </div>

          <div class="flex flex-wrap justify-between gap-3 mt-8">

            ${
              state.currentStep > 0
                ? `
                  <button
                    type="button"
                    id="backBtn"
                    class="px-6 py-3 rounded-xl border-2 border-slate-900 font-bold"
                  >
                    ← بازگشت
                  </button>
                `
                : `<div></div>`
            }

            <div class="text-sm text-slate-400 flex items-center">
              با انتخاب گزینه، مرحله بعد باز می‌شود
            </div>

          </div>

        </section>

      </div>

    </main>
  `;

  document
    .querySelectorAll("[data-option-index]")
    .forEach(button => {

      button.addEventListener("click", () => {

        const index =
          Number(button.dataset.optionIndex);

        const answer =
          question.options[index];

        state.answers[question.id] = answer;

        saveState();

        if (state.currentStep < QUESTIONS.length - 1) {

          state.currentStep++;
          renderQuestionnaire();

        } else {

          showLoader("در حال ساخت تقویم محتوایی شما...");

          setTimeout(() => {

            state.generated = generateContent();

            saveState();

            hideLoader();

            renderResults();

          }, 450);

        }

      });

    });

  document
    .getElementById("backBtn")
    ?.addEventListener("click", () => {

      state.currentStep--;

      renderQuestionnaire();

    });
}

/* =========================================================
   RESULT EVENTS
========================================================= */

function bindResultsEvents() {

  document
    .querySelectorAll("[data-copy]")
    .forEach(button => {

      button.addEventListener("click", async () => {

        const value =
          decodeURIComponent(button.dataset.copy);

        await copyText(value);

      });

    });

  document
    .getElementById("downloadBtn")
    ?.addEventListener("click", downloadImage);

  document
    .getElementById("copyAllBtn")
    ?.addEventListener("click", copyAllContent);

  document
    .getElementById("restartBtn")
    ?.addEventListener("click", restart);

  document
    .getElementById("editBtn")
    ?.addEventListener("click", editAnswers);
}

async function copyText(text) {

  try {

    if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
    } else {

      const textarea =
        document.createElement("textarea");

      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";

      document.body.appendChild(textarea);

      textarea.select();
      document.execCommand("copy");

      textarea.remove();
    }

    showToast("با موفقیت کپی شد ✓");

  } catch (error) {

    console.error(error);
    showToast("کپی کردن انجام نشد.");

  }
}

async function copyAllContent() {

  const text = state.generated.map((item, index) => {

    return `
${item.day}
نوع محتوا: ${item.template}
زمان: ${item.bestTime}

هوک:
${item.hook}

ساختار:
${item.content}

CTA:
${item.cta}

فرمت:
${item.format}

هشتگ‌ها:
${item.hashtags}

-----------------------------
`;

  }).join("\n");

  await copyText(text);
}

/* =========================================================
   IMAGE DOWNLOAD
========================================================= */

async function downloadImage() {

  if (
    typeof html2canvas === "undefined"
  ) {
    showToast("کتابخانه ساخت تصویر بارگذاری نشده است.");
    return;
  }

  showLoader("در حال ساخت تصویر تقویم...");

  let wrapper = null;

  try {

    wrapper =
      document.createElement("div");

    wrapper.className = "download-area";

    wrapper.innerHTML =
      createDownloadHTML();

    document.body.appendChild(wrapper);

    await waitForFonts();

    await new Promise(resolve =>
      setTimeout(resolve, 250)
    );

    const canvas =
      await html2canvas(wrapper, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        allowTaint: false,
        logging: false
      });

    const link =
      document.createElement("a");

    const date =
      new Date()
        .toLocaleDateString("fa-IR")
        .replace(/\//g, "-");

    link.download =
      `Koosha-Instagram-Content-${date}.png`;

    link.href =
      canvas.toDataURL("image/png", 1);

    document.body.appendChild(link);
    link.click();
    link.remove();

    showToast("تصویر تقویم با موفقیت ساخته شد ✓");

  } catch (error) {

    console.error("Image error:", error);

    showToast(
      "ساخت تصویر با خطا مواجه شد. دوباره تلاش کنید."
    );

  } finally {

    wrapper?.remove();
    hideLoader();

  }
}

async function waitForFonts() {

  if (document.fonts?.ready) {
    try {
      await document.fonts.ready;
    } catch (_) {}
  }
}

/* =========================================================
   NAVIGATION
========================================================= */

function editAnswers() {

  state.currentStep = 0;

  renderQuestionnaire();
}

function restart() {

  const confirmed =
    confirm(
      "آیا مطمئن هستید که می‌خواهید تقویم فعلی را پاک کنید؟"
    );

  if (!confirmed) return;

  state = {
    currentStep: 0,
    answers: {},
    generated: [],
    loggedIn: true
  };

  localStorage.removeItem(STORAGE_KEY);

  renderQuestionnaire();
}

/* =========================================================
   SDK SUPPORT
========================================================= */

async function onConfigChange(newConfig) {

  config = {
    ...config,
    ...newConfig
  };

  applyTheme();

  if (!state.loggedIn) {
    renderLogin();
    return;
  }

  if (state.generated.length) {
    renderResults();
  } else {
    renderQuestionnaire();
  }
}

function applyTheme() {

  const root =
    document.documentElement;

  root.style.setProperty(
    "--primary",
    config.primary_color || DEFAULT_CONFIG.primary_color
  );

  root.style.setProperty(
    "--secondary",
    config.secondary_color || DEFAULT_CONFIG.secondary_color
  );

  root.style.setProperty(
    "--text",
    config.text_color || DEFAULT_CONFIG.text_color
  );

  root.style.setProperty(
    "--primary-dark",
    config.accent_color || DEFAULT_CONFIG.accent_color
  );

  root.style.setProperty(
    "--background",
    config.background_color || DEFAULT_CONFIG.background_color
  );

  document.body.style.fontFamily =
    `"${config.font_family || "Vazirmatn"}", sans-serif`;
}

const capabilities = {

  recolorables: [
    {
      get: () => config.background_color,
      set: value => {
        config.background_color = value;
        window.elementSdk?.setConfig({
          background_color: value
        });
      }
    },
    {
      get: () => config.secondary_color,
      set: value => {
        config.secondary_color = value;
        window.elementSdk?.setConfig({
          secondary_color: value
        });
      }
    },
    {
      get: () => config.text_color,
      set: value => {
        config.text_color = value;
        window.elementSdk?.setConfig({
          text_color: value
        });
      }
    },
    {
      get: () => config.primary_color,
      set: value => {
        config.primary_color = value;
        window.elementSdk?.setConfig({
          primary_color: value
        });
      }
    },
    {
      get: () => config.accent_color,
      set: value => {
        config.accent_color = value;
        window.elementSdk?.setConfig({
          accent_color: value
        });
      }
    }
  ],

  borderables: [],

  fontEditable: {
    get: () => config.font_family,
    set: value => {
      config.font_family = value;

      window.elementSdk?.setConfig({
        font_family: value
      });
    }
  },

  fontSizeable: {
    get: () => config.font_size,
    set: value => {
      config.font_size = value;

      window.elementSdk?.setConfig({
        font_size: value
      });
    }
  }
};

/* =========================================================
   INIT
========================================================= */

function initSDK() {

  if (!window.elementSdk) {
    applyTheme();
    return;
  }

  try {

    window.elementSdk.init({

      defaultConfig: DEFAULT_CONFIG,

      onConfigChange,

      mapToCapabilities: () =>
        capabilities,

      mapToEditPanelValues: cfg =>
        new Map([
          [
            "app_title",
            cfg.app_title ||
            DEFAULT_CONFIG.app_title
          ],
          [
            "login_password",
            cfg.login_password ||
            DEFAULT_CONFIG.login_password
          ],
          [
            "logo_text",
            cfg.logo_text ||
            DEFAULT_CONFIG.logo_text
          ]
        ])
    );

  } catch (error) {

    console.warn(
      "Element SDK initialization failed:",
      error
    );

    applyTheme();
  }
}

/* =========================================================
   START
========================================================= */

loadState();

initSDK();

applyTheme();

renderLogin();

</script>
